- name: Add the CloudNativePG Helm repository
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: "{{ postgresql_operator_chart_repo }}"
    force: true
    binary_path: /usr/local/bin/helm

- name: Install the CloudNativePG operator
  kubernetes.core.helm:
    name: "{{ postgresql_operator_release }}"
    chart_ref: "{{ postgresql_operator_chart_name }}"
    chart_version: "{{ postgresql_operator_chart_version }}"
    release_namespace: "{{ postgresql_operator_namespace }}"
    create_namespace: true
    kubeconfig: "{{ postgresql_kubeconfig }}"
    binary_path: /usr/local/bin/helm
    wait: true
    wait_timeout: 300s
    update_repo_cache: true

- name: Wait for the Cluster CRD
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusters.postgresql.cnpg.io
    kubeconfig: "{{ postgresql_kubeconfig }}"
  register: postgresql_crd
  until: postgresql_crd is succeeded and postgresql_crd.get('resources', []) | length > 0
  retries: 24
  delay: 5

- name: Apply PostgreSQL namespace and secrets
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ postgresql_kubeconfig }}"
    definition: "{{ lookup('template', 'secrets.yml.j2') | from_yaml_all | list }}"
  no_log: true

- name: Render CloudNativePG cluster values
  ansible.builtin.template:
    src: cluster-values.yml.j2
    dest: /etc/kubernetes/postgresql-cluster-values.yml
    owner: root
    group: root
    mode: '0600'

- name: Install the PostgreSQL cluster
  kubernetes.core.helm:
    name: "{{ postgresql_cluster_release }}"
    chart_ref: "{{ postgresql_cluster_chart_name }}"
    chart_version: "{{ postgresql_cluster_chart_version }}"
    release_namespace: "{{ postgresql_namespace }}"
    create_namespace: true
    kubeconfig: "{{ postgresql_kubeconfig }}"
    binary_path: /usr/local/bin/helm
    values_files:
      - /etc/kubernetes/postgresql-cluster-values.yml
    wait: true
    wait_timeout: 900s
    update_repo_cache: true

- name: Wait until the PostgreSQL cluster is ready
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ postgresql_cluster_name }}"
    namespace: "{{ postgresql_namespace }}"
    kubeconfig: "{{ postgresql_kubeconfig }}"
  register: postgresql_cluster
  until: >-
    postgresql_cluster is succeeded
    and postgresql_cluster.get('resources', []) | length > 0
    and postgresql_cluster.resources[0].status.conditions | default([])
    | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True')
    | list | length > 0
  retries: 90
  delay: 10
