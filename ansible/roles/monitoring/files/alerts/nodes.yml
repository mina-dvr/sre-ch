apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mina-nodes
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: mina.nodes
      rules:
        - alert: NodeCPUHigh
          expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CPU on {{ $labels.instance }} is above 80%"
            description: "CPU usage is {{ $value }}% for 10 minutes."
        - alert: NodeMemoryHigh
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Memory on {{ $labels.instance }} is above 85%"
            description: "Memory usage is {{ $value }}%."
        - alert: NodeDiskHigh
          expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk on {{ $labels.instance }} {{ $labels.mountpoint }} is above 85%"
            description: "Filesystem usage is {{ $value }}%."
