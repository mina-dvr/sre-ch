---
# Ansible always connects as root. The mina Linux user is only for later
# operator SSH checks; playbooks do not switch to it.
ansible_user: root
ansible_become: true
ansible_python_interpreter: /usr/bin/python3
# user_management role: groups, operator users, and the passwordless sudo group.
user_management_groups:
  - infra
user_management_sudo_group: infra
user_management_users:
  - username: mina
    groups:
      - infra
    ssh_key: "ssh-rsa  Generated by ArvanCloud"

# packages role: apt upgrade policy, base tooling, and packages to remove.
packages_upgrade: safe
packages_base:
  - bash-completion
  - ca-certificates
  - curl
  - htop
  - tree
  - wget
  - zip
  - vim
  - net-tools
  - less
  - tcpdump
  - rsync
  - git
  - lsof
  - pv
  - ncdu
packages_remove:
  - telnet

# ntp role: time servers used by chrony.
ntp_servers:
  - time.cloudflare.com
  - ntp.ubuntu.com
